[package]
name = "ebobo-migration"
version = "0.0.2"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-std = { version = "1", features = ["attributes", "tokio1"] }
regex = { version = "1", features = ["std"] }

[dependencies.sea-orm-migration]
version = "0.12.0"
features = ["sqlx-postgres", "runtime-tokio-native-tls"]
